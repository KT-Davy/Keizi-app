<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation du mot de passe</title>
  <!-- Chargement du SDK Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
    }
    h2 { margin-top: 0; font-size: 20px; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3ecf8e;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .message { font-size: 14px; margin-top: 15px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

<div class="card">
  <h2>Nouveau mot de passe</h2>
  <form id="reset-form">
    <div class="form-group">
      <label for="password">Entrez votre nouveau mot de passe :</label>
      <input type="password" id="password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm-password">Confirmez le mot de passe :</label>
      <input type="password" id="confirm-password" required minlength="6">
    </div>
    <button type="submit" id="btn-submit">Mettre à jour</button>
  </form>
  <div id="status-message" class="message"></div>
</div>

<script>
  // Remplace ces valeurs par tes vraies clés Supabase (les mêmes que dans ton index.html)
  const SUPABASE_URL = "https://TON_PROJET.supabase.co";
  const SUPABASE_ANON_KEY = "TA_CLE_ANON_PUBLIQUE";

  const { createClient } = supabase;
  const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('reset-form');
  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirm-password');
  const btnSubmit = document.getElementById('btn-submit');
  const statusMessage = document.getElementById('status-message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMessage.innerText = "";
    statusMessage.className = "message";

    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (password !== confirmPassword) {
      statusMessage.innerText = "Les mots de passe ne correspondent pas.";
      statusMessage.className = "message error";
      return;
    }

    btnSubmit.disabled = true;
    btnSubmit.innerText = "Mise à jour...";

    // Envoi du nouveau mot de passe à Supabase
    const { data, error } = await supabaseClient.auth.updateUser({
      password: password
    });

    if (error) {
      statusMessage.innerText = "Erreur : " + error.message;
      statusMessage.className = "message error";
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Mettre à jour";
    } else {
      statusMessage.innerText = "Mot de passe mis à jour avec succès ! Vous pouvez maintenant fermer cette page ou vous connecter.";
      statusMessage.className = "message success";
      form.reset();
    }
  });
</script>

</body>
</html>
